# Simulación del sistema distribuido de respaldo del POS de la veterinaria.
#   red "internet" : VPS (mariadb-nube) + canales Rappi/Woo + POS + sync
#   red "tienda"   : servidor de respaldo físico (mariadb-local) + POS + sync
# Cortar la red "internet" del POS/sync simula que la tienda se queda sin internet.

x-db-env: &db-env
  MARIADB_DATABASE: ${DB_NAME}
  MARIADB_USER: ${DB_USER}
  MARIADB_PASSWORD: ${DB_PASSWORD}
  TZ: America/Bogota

x-app-env: &app-env
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  NUBE_HOST: mariadb-nube
  LOCAL_HOST: mariadb-local
  DB_CONNECT_TIMEOUT: "1"
  DB_READ_TIMEOUT: "3"
  DB_WRITE_TIMEOUT: "3"
  TZ: America/Bogota

services:
  mariadb-nube:
    image: mariadb:11.4
    container_name: vet-nube
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--max-connections=80", "--innodb-log-buffer-size=4M", "--key-buffer-size=8M"]
    environment:
      <<: *db-env
      MARIADB_ROOT_PASSWORD: ${NUBE_ROOT_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - nube_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    networks: [internet]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb-local:
    image: mariadb:11.4
    container_name: vet-local
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--max-connections=80", "--innodb-log-buffer-size=4M", "--key-buffer-size=8M"]
    environment:
      <<: *db-env
      MARIADB_ROOT_PASSWORD: ${LOCAL_ROOT_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - local_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3308:3306"
    networks: [tienda]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  pos:
    build: { context: ., dockerfile: pos/Dockerfile }
    container_name: vet-pos
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET}
      POS_ADMIN_USER: ${POS_ADMIN_USER}
      POS_ADMIN_PASS: ${POS_ADMIN_PASS}
      POS_CAJERO_USER: ${POS_CAJERO_USER}
      POS_CAJERO_PASS: ${POS_CAJERO_PASS}
      CB_UMBRAL_FALLOS: "2"
      CB_TIEMPO_RESET: "8"
    ports:
      - "8000:8000"
    depends_on:
      mariadb-nube: { condition: service_healthy }
      mariadb-local: { condition: service_healthy }
    networks: [internet, tienda]
    restart: unless-stopped

  sync:
    build: { context: ., dockerfile: sync/Dockerfile }
    container_name: vet-sync
    environment:
      <<: *app-env
      SYNC_INTERVALO: "2"
      SYNC_BACKOFF_MAX: "8"
    depends_on:
      mariadb-nube: { condition: service_healthy }
      mariadb-local: { condition: service_healthy }
    networks: [internet, tienda]
    restart: unless-stopped

  canales:
    build: { context: ., dockerfile: canales/Dockerfile }
    container_name: vet-canales
    environment:
      <<: *app-env
      CANALES_INTERVALO: "6"
      CANALES_ACTIVO: "1"
    depends_on:
      mariadb-nube: { condition: service_healthy }
    networks: [internet]
    restart: unless-stopped

networks:
  internet:
    name: vet_internet
  tienda:
    name: vet_tienda

volumes:
  nube_data:
  local_data:
